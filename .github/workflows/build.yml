name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip if present
        run: |
          if [ -f update.zip ]; then
            OLD_CODE=$(grep -oP 'versionCode = \K[0-9]+' build.gradle.kts | head -1)
            unzip -o update.zip
            rm update.zip
            # every applied update is a new build: the code goes up by one by itself,
            # and the name comes from the first line of RELEASE_NOTES.md ("الإصدار 0.49")
            NEW_CODE=$((OLD_CODE + 1))
            sed -i -E "s/versionCode = [0-9]+/versionCode = $NEW_CODE/" build.gradle.kts
            NAME=$(head -1 RELEASE_NOTES.md | grep -oP '[0-9]+(\.[0-9]+)+' | head -1 || true)
            if [ -n "$NAME" ]; then
              sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$NAME\"/" build.gradle.kts
            fi
            echo "Version: ${NAME:-unchanged} (code $NEW_CODE)"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Apply update" || true
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write the release key (only if the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "Release key found"
          else
            echo "No release key: building with a temporary debug key"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Read the version
        id: ver
        run: |
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          NAME=$(grep -oP 'versionName = "\K[^"]+' build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cp "$(ls build/outputs/apk/release/*.apk | head -1)" "CandyAI-$NAME.apk"
      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ver.outputs.code }}
          name: Candy ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: CandyAI-${{ steps.ver.outputs.name }}.apk
          make_latest: true
